[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hireburn"
version = "0.1.0"
description = "Open-source AI HR hunter: record your AI avatar once, reach candidates at a human pace, let the avatar run first interviews, and see where your funnel leaks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evgenii Arsentev" }]
keywords = ["hiring", "recruiting", "ai-interview", "ai-avatar", "linkedin-outreach", "hiring-funnel", "nyc-local-law-144", "ai-video-interview-act", "eu-ai-act", "hr-tech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hireburn = "hireburn.cli:main"

[project.urls]
Homepage = "https://arsentev.ai/research/ai-hiring"
Repository = "https://github.com/arsentev-ai/hireburn"
Research = "https://doi.org/10.5281/zenodo.23927437"
Author = "https://orcid.org/0000-0002-9120-7298"

[tool.setuptools.packages.find]
include = ["hireburn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
